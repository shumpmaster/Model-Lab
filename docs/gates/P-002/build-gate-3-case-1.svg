<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="sans-serif" font-size="13">
  <title>Your way of working today, against the change</title>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#888888" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="250" fill="#ffffff"/>
  <text x="10" y="22" font-weight="bold" fill="#222222">Today</text>
  <rect x="10" y="34" width="330" height="44" rx="6" fill="#eef2f7" stroke="#444444"/>
  <text x="20" y="54" fill="#222222">Ways of running the team change fast,</text>
  <text x="20" y="70" fill="#222222">mostly reported by their makers</text>
  <line x1="350" y1="56" x2="400" y2="56" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="410" y="34" width="340" height="44" rx="6" fill="url(#hatch)" stroke="#444444" stroke-dasharray="5 3"/>
  <rect x="420" y="44" width="320" height="24" fill="#ffffff" opacity="0.9"/>
  <text x="430" y="61" fill="#222222">Starting share needing you: not measured yet</text>
  <text x="10" y="122" font-weight="bold" fill="#222222">After</text>
  <rect x="10" y="134" width="130" height="44" rx="6" fill="#eef7ee" stroke="#444444"/>
  <text x="20" y="160" fill="#222222">Feeds read on a rhythm</text>
  <line x1="140" y1="156" x2="160" y2="156" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="162" y="134" width="130" height="44" rx="6" fill="#eef7ee" stroke="#444444"/>
  <text x="172" y="160" fill="#222222">Your entry card</text>
  <line x1="292" y1="156" x2="312" y2="156" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="314" y="134" width="130" height="44" rx="6" fill="#eef7ee" stroke="#444444"/>
  <text x="324" y="160" fill="#222222">A fair trial</text>
  <line x1="444" y1="156" x2="464" y2="156" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="466" y="134" width="130" height="44" rx="6" fill="#eef7ee" stroke="#444444"/>
  <text x="476" y="160" fill="#222222">Your results card</text>
  <line x1="596" y1="156" x2="616" y2="156" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="618" y="134" width="132" height="44" rx="6" fill="#eef7ee" stroke="#444444"/>
  <text x="626" y="152" fill="#222222">Kept methods</text>
  <text x="626" y="168" fill="#222222">in the model</text>
  <rect x="410" y="200" width="22" height="14" fill="url(#hatch)" stroke="#444444" stroke-dasharray="5 3"/>
  <text x="440" y="212" fill="#444444">hatched: not measured yet</text>
</svg>
